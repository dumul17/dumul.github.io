<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 28%,#10222f 0%,#08121b 55%,#04080d 100%);color:#dbe7f3;font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

header{position:fixed;top:0;left:0;right:0;z-index:3;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
h1{margin:0;display:inline-block;pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.kicker{display:block;font:600 12px/1 'Syne',sans-serif;letter-spacing:.55em;padding-left:.55em;text-transform:uppercase;color:#6ee5ff}
.big{display:block;margin-top:9px;white-space:nowrap;font:800 clamp(20px,min(7vw,10vh),56px)/1.02 'Syne',sans-serif;letter-spacing:.06em;padding-left:.06em;text-transform:uppercase;color:#eaf6ff;text-shadow:0 0 22px rgba(110,229,255,.45),0 0 2px rgba(255,255,255,.35)}
.sub{margin:10px 0 0;font-size:11px;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;color:rgba(184,198,214,.72)}
h1.gl .big{animation:gl .65s steps(1,end)}
h1.gl .kicker{animation:gk .65s steps(1,end)}
@keyframes gl{
0%{transform:translate(-3px,1px) skewX(-8deg);text-shadow:4px 0 #ff2bd6,-4px 0 #22e6ff}
12%{transform:translate(4px,-1px) skewX(6deg);text-shadow:-4px 0 #ff2bd6,4px 0 #22e6ff;clip-path:inset(0 0 55% 0)}
24%{transform:translate(-2px,0);clip-path:inset(45% 0 0 0);text-shadow:0 0 18px rgba(110,229,255,.9)}
36%{transform:translate(3px,2px) skewX(-4deg);clip-path:none;text-shadow:5px 0 #ff2bd6,-5px 0 #22e6ff}
50%{transform:translate(-4px,-1px);opacity:.55;clip-path:inset(20% 0 40% 0)}
58%{transform:none;opacity:1;clip-path:none;text-shadow:-3px 0 #ff2bd6,3px 0 #22e6ff}
72%{transform:translate(2px,1px) skewX(5deg)}
86%{transform:translate(-1px,0);text-shadow:2px 0 #ff2bd6,-2px 0 #22e6ff}
100%{transform:none}}
@keyframes gk{0%{transform:translateX(4px);color:#ff7ad9}30%{transform:translateX(-4px);color:#6ee5ff}60%{transform:translateX(3px);color:#ff7ad9}100%{transform:none}}

.quote{margin:2px 0 0;font-size:11px;font-style:italic;letter-spacing:.04em;color:rgba(184,198,214,.45)}

#betel-fx{position:fixed;left:0;top:0;z-index:4;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;border-radius:50%;padding:0;background:transparent;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
#betel-fx:focus-visible{outline:2px solid #ff7ad9;outline-offset:2px}
/* visual trigger bintang: ring pulse dirender di canvas, hit area tetap transparan */
.portal
,.hit{position:fixed;left:0;top:0;z-index:4}
.portal{display:block;margin-top:-24px;color:#eaf6ff;text-decoration:none;opacity:0;transition:opacity .9s;will-change:transform}
.portal.on{opacity:1}
.portal .lab{display:block;padding:6px 12px;border-left:1px solid rgba(110,229,255,.55);background:linear-gradient(90deg,rgba(6,11,17,.6),transparent)}

#secret-msg.on{opacity:1}
#terminal{position:fixed;left:50%;bottom:74px;z-index:10;width:min(88vw,430px);padding:14px 16px;border:1px solid rgba(110,229,255,.38);background:rgba(3,8,12,.92);box-shadow:0 0 30px rgba(110,229,255,.12),inset 0 0 22px rgba(110,229,255,.035);font:11px/1.65 'Courier New',monospace;color:#8eeeff;opacity:0;transform:translate(-50%,18px);pointer-events:none;transition:opacity .35s,transform .35s}
#terminal.on{opacity:1;transform:translate(-50%,0)}
#terminal .term-title{color:#eaf6ff;letter-spacing:.14em}
#terminal .cursor{display:inline-block;width:7px;height:12px;background:#6ee5ff;vertical-align:-2px;animation:blink .8s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
.supernova-flash{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle at var(--sx) var(--sy),rgba(255,245,210,.98) 0,rgba(255,100,50,.68) 4%,rgba(255,45,35,.2) 13%,transparent 42%);opacity:0}
.supernova-flash.on{animation:snflash .85s ease-out forwards}
@keyframes snflash{0%{opacity:0}12%{opacity:1}30%{opacity:.78}100%{opacity:0}}
body.konami #sky{filter:none}
body.konami .scan{background:repeating-linear-gradient(0deg,rgba(40,255,100,.08) 0 1px,transparent 1px 3px)}
body.konami #title .big,body.konami #title .kicker{color:#65ff88;text-shadow:0 0 18px rgba(60,255,100,.7)}
body.konami #sky{animation:greenGlitch .55s steps(2,end) 3}
@keyframes greenGlitch{0%,100%{transform:none;filter:none}20%{transform:translateX(-3px);filter:hue-rotate(80deg) saturate(1.5)}45%{transform:translateX(4px);filter:hue-rotate(110deg) saturate(2)}70%{transform:translateX(-1px);filter:hue-rotate(90deg)}}
.portal .lab:after{content:'OPEN →';display:block;margin-top:4px;font:600 8px/1 'Courier New',monospace;letter-spacing:.14em;color:rgba(110,229,255,.42);transition:color .2s,transform .2s}
.portal:hover .lab:after,.portal.hot .lab:after,.portal:focus-visible .lab:after{color:#6ee5ff;transform:translateX(3px)}
/* tap/hover feedback for constellation geometry */
.cons-hot-line{filter:drop-shadow(0 0 4px rgba(110,229,255,.45))}
@media (max-width:600px){
  #owl-source{right:10px;width:31px;height:31px}
  #terminal{bottom:68px;font-size:10px}
}

@media (prefers-reduced-motion:reduce){h1.gl .big,h1.gl .kicker{animation-duration:.01s}}
</style>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var cv=$('#sky'),g=cv.getContext('2d');
var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var W=0,H=0,DPR=1,START=performance.now();
var mouse={x:0,y:0,tx:0,ty:0},glitchUntil=0,hot=null;
var touchMode=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var drag={on:false,moved:false,pid:null,x0:0,y0:0,bx:0,by:0};
var tapFlash={until:0,cons:null};
var konamiSeq=[],konami=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight'];
var utcClicks=0,utcReset=0,secretStar=null;
var SW=null,swP=0;
var AMB=mkAudio('constellation.mp3',.5,true);
var GARG=mkAudio('gargantua.mp3',0,true);
var SFX={rigel:mkAudio('rigel.mp3',.85,false),spica:mkAudio('spica.mp3',.85,false),betel:mkAudio('betelgeuse.mp3',.85,false)};
function mkAudio(name,vol,loop){var a=new Audio(encodeURIComponent(name));a.preload='none';a.loop=!!loop;a.volume=vol;return a;}
function safePlay(a){var p=a.play();if(p&&p.catch)p.catch(function(){});}
function haptic(ms){
  if(navigator.vibrate)try{navigator.vibrate(ms||10);}catch(e){}
}
function showSecretSequence(){
  var el=$('#secret-msg');if(!el)return;
  clearTimeout(el._t);clearTimeout(el._type);
  el.classList.add('on');el.textContent='';
  var first='Hello, I love You...',finalText='Hello, Friend...';
  var i=0,phase=0;
  function typeFirst(){
    if(i<first.length){el.textContent+=first.charAt(i++);el._type=setTimeout(typeFirst,58);return;}
    el._type=setTimeout(erase,520);
  }
  function erase(){
    if(el.textContent.length>6){el.textContent=el.textContent.slice(0,-1);el._type=setTimeout(erase,42);return;}
    phase=1;i=6;el._type=setTimeout(typeFinal,280);
  }
  function typeFinal(){
    if(i<finalText.length){el.textContent+=finalText.charAt(i++);el._type=setTimeout(typeFinal,58);return;}
    el._t=setTimeout(function(){el.classList.remove('on');},5200);
  }
  typeFirst();
}
function fadeTo(a,vol,ms){
  clearInterval(a._f);var v0=a.volume,t0=performance.now();
  if(vol>0&&a.paused)safePlay(a);
  a._f=setInterval(function(){
    var u=Math.min(1,(performance.now()-t0)/ms),v=v0+(vol-v0)*u;
    a.volume=Math.max(0,Math.min(1,v));
    if(u>=1){clearInterval(a._f);if(vol<=0)a.pause();}
  },40);
}
var activeSfx=null;
function ambTry(){
  if(!activeSfx||activeSfx.paused)safePlay(AMB);
}
function playSfx(a){
  /* Toggle seperti player di dumul.html: pause tidak me-reset posisi. */
  if(activeSfx===a){
    if(a.paused){
      AMB.pause();
      safePlay(a);
    }else{
      a.pause();
      AMB.volume=.5;
      ambTry();
    }
    return;
  }
  AMB.pause();
  if(activeSfx&&activeSfx!==a){activeSfx.pause();activeSfx.currentTime=0;}
  activeSfx=a;
  safePlay(a);
  a.onended=function(){
    if(activeSfx===a){
      activeSfx=null;
      AMB.volume=.5;
      ambTry();
    }
  };
}
var BH={x:0,y:0,R:26,Rr:0,h:0,sprite:null,S:0};
function clamp(v){return v<0?0:v>1?1:v;}
function rgb(hex){var n=parseInt(hex.slice(1),16);return((n>>16)&255)+','+((n>>8)&255)+','+(n&255);}

/* ---------- data: koordinat asli (RA derajat, Dec derajat) ---------- */
var CONS=[
 {id:'orion',ra0:84.5,delay:.3,phase:0,
  stars:{
   meissa:{ra:83.78,dec:9.93,r:1.7,c:'#eaf6ff'},
   betel:{ra:88.79,dec:7.41,r:3.5,c:'#ffb27a',name:'Betelgeuse',nx:1,dy:-9},
   bella:{ra:81.28,dec:6.35,r:2.5,c:'#dcefff'},
   mintaka:{ra:83.00,dec:-0.30,r:2.5,c:'#cfeeff'},
   alnilam:{ra:84.05,dec:-1.20,r:2.9,c:'#cfeeff'},
   alnitak:{ra:85.19,dec:-1.94,r:2.7,c:'#cfeeff'},
   saiph:{ra:86.94,dec:-9.67,r:2.4,c:'#cde6ff'},
   rigel:{ra:78.63,dec:-8.20,r:3.7,c:'#bfe0ff',name:'Rigel',nx:1},
   hatysa:{ra:83.86,dec:-5.91,r:1.6,c:'#eaf6ff'}},
  lines:[['meissa','betel'],['meissa','bella'],['betel','bella'],['betel','alnitak'],['bella','mintaka'],['mintaka','alnilam'],['alnilam','alnitak'],['alnitak','saiph'],['mintaka','rigel'],['saiph','rigel'],['alnilam','hatysa']],
  nebula:{ra:83.82,dec:-5.45}},
 {id:'virgo',ra0:190.7,delay:1.4,phase:2.1,
  stars:{
   zavijava:{ra:177.67,dec:1.76,r:1.9,c:'#eaf6ff'},
   zaniah:{ra:184.98,dec:-0.67,r:1.8,c:'#eaf6ff'},
   porrima:{ra:190.42,dec:-1.45,r:2.6,c:'#f0f6ff'},
   minelauva:{ra:193.90,dec:3.40,r:1.9,c:'#ffe9c9'},
   vindem:{ra:195.54,dec:10.96,r:2.4,c:'#ffe0a8'},
   heze:{ra:203.67,dec:-0.60,r:2.1,c:'#eaf6ff'},
   spica:{ra:201.30,dec:-11.16,r:3.8,c:'#bfe0ff',name:'Spica',nx:-1}},
  lines:[['zavijava','zaniah'],['zaniah','porrima'],['porrima','minelauva'],['minelauva','vindem'],['porrima','heze'],['heze','spica']]}
];
CONS.forEach(function(c,ci){
  var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  Object.keys(c.stars).forEach(function(k,i){
    var s=c.stars[k];
    s.rx=-(s.ra-c.ra0)*Math.cos(s.dec*Math.PI/180);s.ry=-s.dec;
    s.rgb=rgb(s.c);s.ph=Math.random()*6.28;s.t0=c.delay+.2;
    s.twinkleSpeed=.00125+Math.random()*.00165;
    s.twinkleDepth=.07+Math.random()*.12;
    s.twinkleJitter=Math.random()<.16;
    minx=Math.min(minx,s.rx);maxx=Math.max(maxx,s.rx);miny=Math.min(miny,s.ry);maxy=Math.max(maxy,s.ry);
  });
  if(c.nebula){c.nebula.rx=-(c.nebula.ra-c.ra0);c.nebula.ry=-c.nebula.dec;}
  c.minx=minx;c.miny=miny;c.bw=maxx-minx;c.bh=maxy-miny;c.ox=0;c.oy=0;

function beginBHDrag(e){
